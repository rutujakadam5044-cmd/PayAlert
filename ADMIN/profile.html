<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Profile | PayAlert</title>
    <link rel="stylesheet" href="../ASSEST/CSS/style.css" />
  </head>
  <body class="admin-theme">
    <div class="dashboard-layout">
      <aside class="sidebar">
        <a class="logo" href="dashboard.html"
          ><span class="logo-mark">₹</span>PayAlert</a
        ><a class="side-link" href="dashboard.html">🏠 Dashboard</a
        ><a class="side-link" href="users.html">👥 Users</a
        ><a class="side-link" href="payments.html">💳 Payments</a
        ><a class="side-link" href="reminders.html">🔔 Reminders</a
        ><a class="side-link" href="reminder-templates.html">📝 Templates</a
        ><a class="side-link" href="reports.html">📊 Reports</a
        ><a class="side-link" href="messages.html">✉️ Messages</a
        ><a class="side-link" href="profile.html">👤 Profile</a
        ><a class="side-link" href="#" onclick="logout()">🚪 Logout</a>
      </aside>
      <main class="main">
        <div class="page-head">
          <div>
            <h1>Admin Profile</h1>
            <p>Manage administrator information.</p>
          </div>
        </div>
        <div class="form-card">
          <form
            onsubmit="
              event.preventDefault();
              showToast('Admin profile updated');
            "
          >
            <div class="form-group">
              <label>Name</label><input value="Administrator" />
            </div>
            <div class="form-group">
              <label>Email</label
              ><input type="email" value="admin@example.com" />
            </div>
            <div class="form-group">
              <label>New Password</label><input type="password" />
            </div>
            <div class="form-actions">
              <button class="btn btn-primary">Update Profile</button>
            </div>
          </form>
        </div>
      </main>
    </div>
    <script src="../ASSEST/js/common.js"></script>
    <script src="../ASSEST/js/admin.js"></script>
  </body>
</html>
