<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />

    <title>Reports | PayAlert</title>

    <link rel="stylesheet" href="../ASSEST/CSS/style.css" />
  </head>

  <body class="admin-theme">
    <div class="dashboard-layout">
      <!-- ================= SIDEBAR ================= -->

      <aside class="sidebar">
        <a class="logo" href="dashboard.html">
          <span class="logo-mark">₹</span>
          PayAlert
        </a>

        <a class="side-link" href="dashboard.html"> 🏠 Dashboard </a>

        <a class="side-link" href="users.html"> 👥 Users </a>

        <a class="side-link" href="payments.html"> 💳 Payments </a>

        <a class="side-link" href="reminders.html"> 🔔 Reminders </a>

        <a class="side-link" href="reminder-templates.html"> 📝 Templates </a>

        <a class="side-link" href="reports.html"> 📊 Reports </a>

        <a class="side-link" href="messages.html"> ✉️ Messages </a>

        <a class="side-link" href="profile.html"> 👤 Profile </a>

        <a class="side-link" href="#" onclick="logout()"> 🚪 Logout </a>
      </aside>

      <!-- ================= MAIN ================= -->

      <main class="main">
        <div class="page-head">
          <div>
            <h1>Reports</h1>

            <p>System-level reporting overview.</p>
          </div>
        </div>

        <!-- ================= KPI ================= -->

        <div class="kpi-grid">
          <div class="stat">
            <span class="label"> Total Payment Value </span>

            <div class="value" id="adminTotalPaymentValue">₹0</div>
          </div>

          <div class="stat">
            <span class="label"> Active Users </span>

            <div class="value" id="adminActiveUsers">0</div>
          </div>

          <div class="stat">
            <span class="label"> Paid Payments </span>

            <div class="value" id="adminPaidPayments">0</div>
          </div>
        </div>

        <!-- ================= ACTIVITY ================= -->

        <div class="panel">
          <h2 class="report-heading">Payment Activity</h2>

          <p>Active payments</p>

          <div class="progress">
            <span id="adminActiveProgress" class="progress-82"></span>
          </div>

          <p class="mt-15">Paid payments</p>

          <div class="progress">
            <span id="adminPaidProgress" class="progress-96"></span>
          </div>
        </div>
      </main>
    </div>

    <!-- ================= JAVASCRIPT ================= -->

    <script src="../ASSEST/js/common.js"></script>

    <script src="../ASSEST/js/admin.js"></script>
  </body>
</html>
