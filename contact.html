<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width,initial-scale=1.0" />

    <title>Contact | PayAlert</title>

    <link rel="stylesheet" href="../ASSEST/CSS/style.css" />
  </head>

  <body>
    <!-- ================= TOPBAR ================= -->

    <div class="topbar">
      <div class="container">
        Smart payment reminders for your subscriptions & bills
      </div>
    </div>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">
      <div class="container nav-inner">
        <a class="logo" href="index.html">
          <span class="logo-mark">₹</span>
          PayAlert
        </a>

        <div class="nav-links">
          <a href="index.html"> Home </a>

          <a href="features.html"> Features </a>

          <a href="about.html"> About </a>

          <a href="contact.html"> Contact </a>

          <a class="btn btn-primary" href="USER/login.html"> Login </a>
        </div>
      </div>
    </nav>

    <!-- ================= CONTACT PAGE ================= -->

    <div class="page">
      <div class="container">
        <div class="section-title">
          <h2>Contact Us</h2>

          <p>Send us a message.</p>
        </div>

        <!-- ================= CONTACT FORM ================= -->

        <div class="form-card">
          <form id="contactForm">
            <div class="form-grid">
              <!-- NAME -->

              <div class="form-group">
                <label for="contactName"> Name </label>

                <input
                  type="text"
                  id="contactName"
                  placeholder="Enter your name"
                  required
                />
              </div>

              <!-- EMAIL -->

              <div class="form-group">
                <label for="contactEmail"> Email </label>

                <input
                  type="email"
                  id="contactEmail"
                  placeholder="Enter your email"
                  required
                />
              </div>

              <!-- SUBJECT -->

              <div class="form-group full">
                <label for="contactSubject"> Subject </label>

                <input
                  type="text"
                  id="contactSubject"
                  placeholder="Enter subject"
                  required
                />
              </div>

              <!-- MESSAGE -->

              <div class="form-group full">
                <label for="contactMessage"> Message </label>

                <textarea
                  id="contactMessage"
                  rows="5"
                  placeholder="Write your message..."
                  required
                ></textarea>
              </div>
            </div>

            <!-- SUBMIT BUTTON -->

            <div class="form-actions">
              <button type="submit" class="btn btn-primary">
                Send Message
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- ================= FOOTER ================= -->

    <footer class="footer">
      <div class="container">
        <h3>PayAlert</h3>

        <p>Payment reminder and tracking system.</p>
      </div>
    </footer>

    <!-- ================= JAVASCRIPT ================= -->

    <script src="ASSEST/js/common.js"></script>

    <script src="ASSEST/js/public.js"></script>
  </body>
</html>
