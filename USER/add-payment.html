<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Payment | PayAlert</title>

    <link rel="stylesheet" href="../ASSEST/CSS/style.css" />
  </head>

  <body class="user-theme">
    <div class="dashboard-layout">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <a class="logo" href="dashboard.html">
          <span class="logo-mark">₹</span>
          PayAlert
        </a>

        <a class="side-link" href="dashboard.html"> 🏠 Dashboard </a>

        <a class="side-link" href="add-payment.html"> ➕ Add Payment </a>

        <a class="side-link" href="payments.html"> 💳 Payments </a>

        <a class="side-link" href="reminders.html"> 🔔 Reminders </a>

        <a class="side-link" href="reports.html"> 📊 Reports </a>

        <a class="side-link" href="profile.html"> 👤 Profile </a>

        <a class="side-link" href="notification-settings.html">
          ⚙️ Notifications
        </a>

        <a class="side-link" href="#" onclick="logout()"> 🚪 Logout </a>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main">
        <div class="page-head">
          <div>
            <h1>Add Payment</h1>

            <p>Add a recurring payment or subscription.</p>
          </div>
        </div>

        <!-- PAYMENT FORM -->
        <div class="form-card">
          <form id="paymentForm">
            <div class="form-grid">
              <!-- PAYMENT NAME -->
              <div class="form-group">
                <label for="paymentName"> Payment / Service Name </label>

                <input
                  id="paymentName"
                  name="name"
                  type="text"
                  required
                  placeholder="Netflix"
                />
              </div>

              <!-- CATEGORY -->
              <div class="form-group">
                <label for="paymentCategory"> Category </label>

                <select id="paymentCategory" name="category">
                  <option value="Entertainment">Entertainment</option>

                  <option value="Mobile">Mobile</option>

                  <option value="Utilities">Utilities</option>

                  <option value="Education">Education</option>

                  <option value="Shopping">Shopping</option>

                  <option value="Other">Other</option>
                </select>
              </div>

              <!-- AMOUNT -->
              <div class="form-group">
                <label for="paymentAmount"> Amount (₹) </label>

                <input
                  id="paymentAmount"
                  name="amount"
                  type="number"
                  min="0"
                  step="0.01"
                  required
                  placeholder="199"
                />
              </div>

              <!-- DUE DATE -->
              <div class="form-group">
                <label for="paymentDueDate"> Due Date </label>

                <input
                  id="paymentDueDate"
                  name="dueDate"
                  type="date"
                  required
                />
              </div>

              <!-- FREQUENCY -->
              <div class="form-group">
                <label for="paymentFrequency"> Frequency </label>

                <select id="paymentFrequency" name="frequency">
                  <option value="Monthly">Monthly</option>

                  <option value="Weekly">Weekly</option>

                  <option value="Quarterly">Quarterly</option>

                  <option value="Yearly">Yearly</option>

                  <option value="One Time">One Time</option>
                </select>
              </div>

              <!-- REMINDER -->
              <div class="form-group">
                <label for="paymentReminder"> Reminder Before </label>

                <select id="paymentReminder" name="reminder">
                  <option value="1 day">1 day</option>

                  <option value="3 days">3 days</option>

                  <option value="5 days">5 days</option>

                  <option value="7 days">7 days</option>
                </select>
              </div>

              <!-- NOTES -->
              <div class="form-group full">
                <label for="paymentNotes"> Notes </label>

                <textarea
                  id="paymentNotes"
                  name="notes"
                  rows="4"
                  placeholder="Optional notes"
                ></textarea>
              </div>
            </div>

            <!-- BUTTONS -->
            <div class="form-actions">
              <a class="btn btn-outline" href="payments.html"> Cancel </a>

              <button type="submit" class="btn btn-primary">
                Save Payment
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>

    <!-- JAVASCRIPT -->
    <script src="../ASSEST/js/common.js"></script>
    <script src="../ASSEST/js/user.js"></script>
    <script src="../ASSEST/js/common.js"></script>

    <script>
      requireUser();
    </script>

    <script src="../ASSEST/js/user.js"></script>
  </body>
</html>
