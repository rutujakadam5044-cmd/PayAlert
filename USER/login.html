<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>User Login | PayAlert</title>
    <link rel="stylesheet" href="../ASSEST/CSS/style.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-box">
        <a class="logo" href="../index.html"
          ><span class="logo-mark">₹</span>PayAlert</a
        >
        <h1>User Login</h1>
        <p class="sub">Sign in to manage your payments.</p>
        <form id="userLoginForm">
  <div class="form-group">
    <label>Email</label>
    <input
      id="email"
      type="email"
      required
      placeholder="you@example.com"
    />
  </div>

  <div class="form-group">
    <label>Password</label>
    <input
      id="loginPassword"
      type="password"
      required
      placeholder="••••••••"
    />
  </div>

  <button type="submit" class="btn btn-primary w-full">
    Login
  </button>
</form>
    <script src="../ASSEST/js/auth.js"></script>
    <script src="../ASSEST/js/common.js"></script>
  </body>
</html>
