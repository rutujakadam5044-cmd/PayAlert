<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Notification-Settings | PayAlert</title>
    <link rel="stylesheet" href="../ASSEST/CSS/style.css" />
  </head>
  <body class="user-theme">
    <div class="dashboard-layout">
      <aside class="sidebar">
        <a class="logo" href="dashboard.html"
          ><span class="logo-mark">₹</span>PayAlert</a
        ><a class="side-link" href="dashboard.html">🏠 Dashboard</a
        ><a class="side-link" href="add-payment.html">➕ Add Payment</a
        ><a class="side-link" href="payments.html">💳 Payments</a
        ><a class="side-link" href="reminders.html">🔔 Reminders</a
        ><a class="side-link" href="reports.html">📊 Reports</a
        ><a class="side-link" href="profile.html">👤 Profile</a
        ><a class="side-link" href="notification-settings.html"
          >⚙️ Notifications</a
        ><a class="side-link" href="#" onclick="logout()">🚪 Logout</a>
      </aside>
      <main class="main">
        <div class="page-head">
          <div>
            <h1>Notification Settings</h1>
            <p>Choose how you want to receive reminders.</p>
          </div>
        </div>
        <div class="form-card">
          <form id="settingsForm">
            <label class="checkbox">
              <input type="checkbox" id="emailNotifications" checked />
              Email notifications
            </label>

            <label class="checkbox">
              <input type="checkbox" id="paymentReminders" checked />
              Payment due reminders
            </label>

            <label class="checkbox">
              <input type="checkbox" id="weeklySummary" />
              Weekly payment summary
            </label>

            <div class="form-group mt-20">
              <label>Default reminder time</label>

              <input type="time" id="reminderTime" value="09:00" />
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary">
                Save Settings
              </button>
            </div>
          </form>
        </div>
      </main>
    </div>
    <script src="../ASSEST/js/common.js"></script>
    <script src="../ASSEST/js/user.js"></script>
    <script src="../ASSEST/js/common.js"></script>

    <script>
      requireUser();
    </script>

    <script src="../ASSEST/js/user.js"></script>
  </body>
</html>
