<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Reports | PayAlert</title>
    <link rel="stylesheet" href="../ASSEST/CSS/style.css" />
  </head>
  <body class="user-theme">
    <div class="dashboard-layout">
      <aside class="sidebar">
        <a class="logo" href="dashboard.html"
          ><span class="logo-mark">₹</span>PayAlert</a
        ><a class="side-link" href="dashboard.html">🏠 Dashboard</a
        ><a class="side-link" href="add-payment.html">➕ Add Payment</a
        ><a class="side-link" href="payments.html">💳 Payments</a
        ><a class="side-link" href="reminders.html">🔔 Reminders</a
        ><a class="side-link" href="reports.html">📊 Reports</a
        ><a class="side-link" href="profile.html">👤 Profile</a
        ><a class="side-link" href="notification-settings.html"
          >⚙️ Notifications</a
        ><a class="side-link" href="#" onclick="logout()">🚪 Logout</a>
      </aside>
      <main class="main">
        <div class="page-head">
          <div>
            <h1>Reports</h1>
            <p>Overview of your recurring payment spending.</p>
          </div>
        </div>
        <div class="kpi-grid">
          <div class="stat">
            <span class="label">Monthly Estimate</span>
            <div class="value" id="monthlyEstimate">₹0</div>
          </div>

          <div class="stat">
            <span class="label">Yearly Estimate</span>
            <div class="value" id="yearlyEstimate">₹0</div>
          </div>

          <div class="stat">
            <span class="label">Active Payments</span>
            <div class="value" id="activePayments">0</div>
          </div>
        </div>
        <div id="categorySpending">
          <p class="empty">Loading category spending...</p>
        </div>
      </main>
    </div>
    <script src="../ASSEST/js/common.js"></script>
    <script src="../ASSEST/js/user.js"></script>
    <script src="../ASSEST/js/common.js"></script>

    <script>
      requireUser();
    </script>

    <script src="../ASSEST/js/user.js"></script>
  </body>
</html>
